name: Deploy to Tarhely.eu
on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v3

    - name: Debug and Deploy
      run: |
        sudo apt-get update && sudo apt-get install lftp -y
        
        lftp -p 21 -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" <<EOF
        set ftp:ssl-allow no
        set ftp:passive-mode on
        
        # 1. Print the current directory the server put us in
        pwd
        
        # 2. List everything we can see
        ls
        
        # 3. Try to upload one single file to test permission
        put todo.md
        
        quit
        EOF