name: Deploy to Tarhely.eu
on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v3

    - name: Deploy to Tarhely.eu
      uses: airvzxf/ftp-deployment-action@latest
      with:
        server: ${{ secrets.FTP_SERVER }}
        user: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local_dir: "./"
        remote_dir: "public_html/" # Try relative path first
        port: 21 # Explicitly set the port
        ftp_passive_mode: true
        ftp_ssl_allow: false # Often needed if the server rejects secure handshakes